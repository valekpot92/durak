<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#2a1608">
<title>Дурак — Подкидной</title>
<style>
  :root {
    --card-w: 60px;
    --card-h: 88px;
    --card-r: 8px;
    --hand-overlap: -20px;
    --gold: #f5b942;
    --text: #f7ecd8;
    --card-shadow: 0 3px 10px rgba(0,0,0,.5);
    --sel-glow: 0 8px 22px rgba(245,185,66,.85);
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }

  html, body {
    height: 100%;
    width: 100%;
    overflow: hidden;
    position: fixed;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #87a4b6;
    color: var(--text);
    user-select: none;
    overscroll-behavior: none;
  }
  button { font-family: inherit; }

  #scene {
    position: fixed;
    inset: 0;
    z-index: 0;
    overflow: hidden;
  }
  #scene svg { width: 100%; height: 100%; display: block; }

  @keyframes sway {
    0%   { transform: rotate(-0.8deg); }
    50%  { transform: rotate(0.9deg); }
    100% { transform: rotate(-0.8deg); }
  }
  .tree-group { transform-origin: 50% 100%; animation: sway 5.2s ease-in-out infinite; }
  .tree-group.t2 { animation-duration: 6.4s; animation-delay: -1.2s; }
  .tree-group.t3 { animation-duration: 7.1s; animation-delay: -2.5s; }

  @keyframes cloudDrift { 0% { transform: translateX(0); } 100% { transform: translateX(60px); } }
  .cloud { animation: cloudDrift 24s ease-in-out infinite alternate; }
  .cloud.c2 { animation-duration: 32s; animation-delay: -8s; }

  #app {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    z-index: 1;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    pointer-events: none;
  }
  #app > * { pointer-events: auto; }

  #topbar {
    flex: 0 0 auto;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 6px 10px;
    font-size: 12px;
    background: rgba(20,10,4,.55);
    backdrop-filter: blur(6px);
    border-bottom: 1px solid rgba(255,255,255,.08);
    color: #f7ecd8;
  }
  .badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: rgba(0,0,0,.35);
    padding: 4px 10px;
    border-radius: 999px;
    font-size: 12px;
    white-space: nowrap;
  }
  #sound-toggle { cursor: pointer; }

  #opp-area {
    flex: 0 0 auto;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 4px 8px;
    min-height: 44px;
    position: relative;
    color: #f7ecd8;
  }
  #opp-hand { display: flex; justify-content: center; }
  .card-back {
    width: 28px;
    height: 42px;
    margin-left: -13px;
    border-radius: 5px;
    background:
      repeating-linear-gradient(45deg, #7a1e1e 0 4px, #9c2e2e 4px 8px),
      #7a1e1e;
    border: 1px solid #c98a4a;
    box-shadow: 1px 2px 4px rgba(0,0,0,.5);
    flex: 0 0 auto;
  }
  .card-back:first-child { margin-left: 0; }
  #opp-name {
    position: absolute;
    left: 10px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 11px;
    opacity: .9;
    text-shadow: 0 1px 3px rgba(0,0,0,.8);
    white-space: nowrap;
  }
  #opp-count {
    position: absolute;
    right: 10px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 11px;
    opacity: .9;
    text-shadow: 0 1px 3px rgba(0,0,0,.8);
    white-space: nowrap;
  }

  #table-zone {
    flex: 1 1 auto;
    margin: 4px 6px;
    border-radius: 14px;
    position: relative;
    overflow: hidden;
    box-shadow:
      0 8px 26px rgba(0,0,0,.55),
      inset 0 0 40px rgba(0,0,0,.4);
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 0;
    background:
      repeating-linear-gradient(92deg,
        rgba(0,0,0,.14) 0 2px, transparent 2px 7px,
        rgba(255,255,255,.05) 7px 9px, transparent 9px 24px),
      repeating-linear-gradient(88deg,
        rgba(0,0,0,.05) 0 1px, transparent 1px 14px),
      radial-gradient(ellipse at 30% 20%, #9a6634 0%, #6b3f1e 45%, #4a2c15 100%);
    border: 6px solid #3a2010;
    border-image: linear-gradient(160deg, #7a4a20 0%, #3a2010 60%, #2a1608 100%) 1;
  }
  #table-zone::before {
    content: '';
    position: absolute;
    left: 50%;
    top: 50%;
    width: 70%;
    height: 70%;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    background: radial-gradient(circle,
      rgba(120,80,40,.35) 0%,
      rgba(80,45,20,.15) 35%,
      transparent 70%);
    pointer-events: none;
  }

  #battlefield {
    position: relative;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(calc(var(--card-w) + 12px), calc(var(--card-w) + 12px)));
    gap: 8px 6px;
    justify-content: center;
    align-content: center;
    max-width: 100%;
    max-height: 100%;
    padding: 6px;
    z-index: 1;
  }
  .pair {
    position: relative;
    width: calc(var(--card-w) + 12px);
    height: calc(var(--card-h) + 14px);
  }
  .pair .slot-atk,
  .pair .slot-def {
    position: absolute;
    width: var(--card-w);
    height: var(--card-h);
    border-radius: var(--card-r);
  }
  .pair .slot-atk { left: 0; top: 0; }
  .pair .slot-def { left: 12px; top: 14px; }
  .pair.beaten .slot-def::after {
    content: '';
    position: absolute;
    inset: -3px;
    border-radius: calc(var(--card-r) + 2px);
    border: 2px solid rgba(120,220,120,.85);
    box-shadow: 0 0 12px rgba(120,220,120,.55);
    pointer-events: none;
    animation: beatPulse 0.9s ease;
  }
  @keyframes beatPulse {
    0%   { opacity: 0; transform: scale(0.85); }
    40%  { opacity: 1; transform: scale(1.05); }
    100% { opacity: .85; transform: scale(1); }
  }

  #deck-wrap {
    position: absolute;
    right: 8px;
    top: 50%;
    transform: translateY(-50%);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    z-index: 3;
  }
  #deck-pile {
    position: relative;
    width: 40px;
    height: 58px;
  }
  #deck-pile .card-back {
    position: absolute;
    inset: 0;
    margin: 0;
    width: 40px;
    height: 58px;
    border-radius: 6px;
  }
  #deck-pile .card-back:nth-child(2) { transform: translate(-2px,-2px); }
  #deck-pile .card-back:nth-child(3) { transform: translate(-4px,-4px); }
  #deck-count {
    font-size: 11px;
    opacity: .95;
    text-shadow: 0 1px 3px #000;
  }

  #trump-slot {
    position: relative;
    width: 44px;
    height: 62px;
    margin-top: 6px;
  }
  #trump-slot .trump-card-big {
    position: absolute;
    inset: 0;
    background: #fffdf7;
    border-radius: 6px;
    box-shadow: 0 3px 10px rgba(0,0,0,.6);
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 3px 4px;
    font-weight: 800;
    transform: rotate(90deg);
  }
  #trump-slot .trump-card-big .r { font-size: 14px; line-height: 1; }
  #trump-slot .trump-card-big .s { font-size: 17px; line-height: 1; align-self: flex-end; }
  #trump-slot .trump-card-big.red { color: #d3202a; }
  #trump-slot .trump-card-big.black { color: #1a2238; }
  #trump-label {
    font-size: 10px;
    opacity: .8;
    color: #f7ecd8;
    text-shadow: 0 1px 3px #000;
    margin-top: -6px;
  }

  #player-area {
    flex: 0 0 auto;
    padding: 4px 4px 6px;
    background: linear-gradient(to top, rgba(20,10,4,.65), transparent 90%);
  }
  #player-hand {
    display: flex;
    justify-content: center;
    align-items: flex-end;
    padding: 2px 8px;
    min-height: calc(var(--card-h) + 14px);
    overflow: hidden;
  }
  #player-hand .card {
    margin-left: var(--hand-overlap, -20px);
    transition: margin .2s;
    flex: 0 0 auto;
  }
  #player-hand .card:first-child { margin-left: 0; }

  #controls {
    display: flex;
    justify-content: center;
    gap: 8px;
    padding: 4px 8px 2px;
  }
  .btn {
    border: none;
    border-radius: 999px;
    padding: 10px 22px;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    transition: transform .1s, opacity .2s, box-shadow .2s;
    box-shadow: 0 3px 0 rgba(0,0,0,.35);
  }
  .btn:active { transform: translateY(2px); box-shadow: 0 1px 0 rgba(0,0,0,.35); }
  .btn:disabled { opacity: .35; pointer-events: none; box-shadow: none; }
  .btn-primary { background: linear-gradient(180deg,#ffcd4d,#e79b1a); color: #3a2300; }
  .btn-danger  { background: linear-gradient(180deg,#e57865,#b93a2c); color: #fff; }
  .btn-ghost   { background: rgba(255,255,255,.16); color: #f7ecd8; box-shadow: none; border: 1px solid rgba(255,255,255,.18); }

  #status {
    text-align: center;
    font-size: 12px;
    padding: 2px 8px 4px;
    min-height: 18px;
    opacity: .95;
    text-shadow: 0 1px 3px rgba(0,0,0,.8);
  }
  #turn-hint {
    text-align: center;
    font-size: 11px;
    color: var(--gold);
    font-weight: 700;
    text-shadow: 0 1px 3px rgba(0,0,0,.8);
    padding: 0 8px 2px;
    min-height: 14px;
  }

  .card {
    container-type: size;
    container-name: card;
    position: relative;
    width: var(--card-w);
    height: var(--card-h);
    background: #fffdf7;
    border-radius: var(--card-r);
    box-shadow: var(--card-shadow);
    transition: transform .15s ease, box-shadow .15s ease;
    overflow: hidden;
  }
  .card::after {
    content: '';
    position: absolute;
    inset: 2px;
    border: 1px solid rgba(0,0,0,.06);
    border-radius: calc(var(--card-r) - 2px);
    pointer-events: none;
  }

  .card .corner {
    position: absolute;
    display: flex;
    flex-direction: column;
    align-items: center;
    line-height: 1;
    font-weight: 900;
    text-shadow: 0 1px 0 rgba(0,0,0,.08);
  }
  .card .corner.tl { top: 3%; left: 6%; }
  .card .corner.br { bottom: 3%; right: 6%; transform: rotate(180deg); }
  .card .corner .r { font-size: 26cqw; letter-spacing: -.5px; }
  .card .corner .s { font-size: 24cqw; margin-top: 2cqw; }

  .card .pips {
    position: absolute;
    left: 22%;
    right: 12%;
    top: 22%;
    bottom: 22%;
    display: grid;
    place-items: center;
    pointer-events: none;
  }
  .card .pips .big-suit { font-size: 62cqw; opacity: .92; line-height: 1; }

  .card .pip-big {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 64cqw;
    opacity: .15;
    line-height: 1;
    pointer-events: none;
    font-weight: 700;
  }

  .card.face .corner .r { font-size: 22cqw; }
  .card.face .corner .s { font-size: 20cqw; }
  .card .face-art {
    position: absolute;
    left: 24%;
    right: 12%;
    top: 22%;
    bottom: 22%;
    border-radius: 8cqw;
    display: flex;
    align-items: center;
    justify-content: center;
    color: currentColor;
    opacity: .92;
  }
  .card .face-art .frame {
    position: absolute;
    inset: 0;
    border: 1.6cqw solid currentColor;
    border-radius: 8cqw;
    opacity: .55;
  }
  .card .face-art .glyph {
    position: relative;
    z-index: 1;
    font-size: 62cqw;
    font-weight: 900;
    line-height: 1;
  }
  .card .face-art .crown {
    position: absolute;
    top: -16cqw;
    left: 50%;
    transform: translateX(-50%);
    font-size: 22cqw;
    opacity: .85;
    line-height: 1;
  }

  .card.red   { color: #d3202a; }
  .card.black { color: #1a2238; }

  .card.selected {
    transform: translateY(-14px);
    box-shadow: var(--sel-glow);
    z-index: 20;
  }
  .card.clickable { cursor: pointer; }
  .card.clickable:active { transform: translateY(-6px) scale(.97); }

  .card.small {
    --card-w: 52px;
    --card-h: 76px;
  }

  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.72);
    backdrop-filter: blur(8px);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 100;
    padding: 16px;
  }
  .overlay.hidden { display: none; }
  .modal {
    width: 100%;
    max-width: 360px;
    background: linear-gradient(180deg,#3a2110,#241209);
    border: 1px solid rgba(245,185,66,.35);
    border-radius: 18px;
    padding: 22px 20px;
    text-align: center;
    box-shadow: 0 20px 60px rgba(0,0,0,.7);
    color: #f7ecd8;
  }
  .modal h2 { font-size: 22px; margin-bottom: 6px; color: var(--gold); }
  .modal p { font-size: 13px; opacity: .85; margin-bottom: 16px; line-height: 1.4; }
  .modal .row { display: flex; flex-direction: column; gap: 10px; margin-top: 12px; }
  .input {
    width: 100%;
    background: rgba(0,0,0,.45);
    border: 1px solid rgba(245,185,66,.4);
    color: #fff;
    padding: 12px 14px;
    font-size: 18px;
    font-weight: 700;
    letter-spacing: 4px;
    text-align: center;
    border-radius: 10px;
    text-transform: uppercase;
    outline: none;
  }
  .input:focus { border-color: var(--gold); }
  .code-display {
    font-family: ui-monospace, Menlo, monospace;
    font-size: 26px;
    font-weight: 800;
    letter-spacing: 6px;
    background: rgba(0,0,0,.5);
    padding: 12px;
    border-radius: 10px;
    margin: 8px 0 4px;
    color: var(--gold);
  }
  .link-row {
    display: flex;
    gap: 6px;
    align-items: center;
    background: rgba(0,0,0,.4);
    border-radius: 10px;
    padding: 6px 10px;
    font-size: 11px;
    margin-bottom: 4px;
    word-break: break-all;
    text-align: left;
  }
  .link-row span { flex: 1; opacity: .85; }
  .link-row button {
    background: transparent;
    border: none;
    color: var(--gold);
    font-weight: 700;
    font-size: 12px;
    cursor: pointer;
    padding: 4px 6px;
  }

  #toast {
    position: fixed;
    left: 50%;
    top: 70px;
    transform: translate(-50%, -12px);
    background: rgba(20,10,4,.92);
    color: #f7ecd8;
    padding: 9px 18px;
    border-radius: 999px;
    font-size: 13px;
    font-weight: 600;
    border: 1px solid rgba(245,185,66,.4);
    opacity: 0;
    transition: opacity .3s, transform .3s;
    pointer-events: none;
    z-index: 300;
    white-space: nowrap;
    max-width: 90vw;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  #toast.show { opacity: 1; transform: translate(-50%, 0); }

  @media (max-width: 360px) {
    :root { --card-w: 52px; --card-h: 76px; }
    .card.small { --card-w: 46px; --card-h: 68px; }
    #topbar { font-size: 11px; padding: 5px 8px; }
    .badge { font-size: 11px; padding: 3px 8px; }
    #status { font-size: 11px; }
    #turn-hint { font-size: 10px; }
    #table-zone { margin: 4px 4px; border-width: 4px; }
    #deck-pile { width: 34px; height: 50px; }
    #deck-pile .card-back { width: 34px; height: 50px; border-radius: 5px; }
    #trump-slot { width: 38px; height: 54px; }
    #trump-slot .trump-card-big .r { font-size: 12px; }
    #trump-slot .trump-card-big .s { font-size: 14px; }
    .card-back { width: 24px; height: 36px; margin-left: -11px; }
  }
  @media (min-width: 361px) and (max-width: 400px) {
    :root { --card-w: 56px; --card-h: 82px; }
    .card.small { --card-w: 48px; --card-h: 70px; }
    #table-zone { margin: 4px 5px; border-width: 4px; }
  }
  @media (min-width: 401px) and (max-width: 480px) {
    :root { --card-w: 60px; --card-h: 88px; }
    .card.small { --card-w: 52px; --card-h: 76px; }
    #table-zone { margin: 4px 6px; border-width: 5px; }
  }
  @media (min-width: 481px) and (max-width: 600px) {
    :root { --card-w: 66px; --card-h: 96px; }
    .card.small { --card-w: 58px; --card-h: 84px; }
  }
  @media (min-width: 601px) and (max-width: 720px) {
    :root { --card-w: 74px; --card-h: 108px; }
    .card.small { --card-w: 62px; --card-h: 90px; }
  }
  @media (min-width: 721px) {
    :root { --card-w: 92px; --card-h: 132px; }
    .card.small { --card-w: 76px; --card-h: 110px; }
    #topbar { font-size: 14px; padding: 8px 16px; }
    .badge { font-size: 13px; padding: 5px 12px; }
    #status { font-size: 15px; }
    #turn-hint { font-size: 13px; }
    .btn { font-size: 15px; padding: 11px 26px; }
    #deck-pile { width: 62px; height: 90px; }
    #deck-pile .card-back { width: 62px; height: 90px; border-radius: 8px; }
    #trump-slot { width: 66px; height: 94px; }
    #trump-slot .trump-card-big .r { font-size: 18px; }
    #trump-slot .trump-card-big .s { font-size: 22px; }
    .card-back { width: 40px; height: 58px; margin-left: -20px; }
  }
  @media (min-width: 1100px) {
    :root { --card-w: 108px; --card-h: 154px; }
    .card.small { --card-w: 88px; --card-h: 126px; }
  }
  @media (max-height: 520px) {
    :root { --card-w: 54px; --card-h: 80px; }
    .card.small { --card-w: 46px; --card-h: 68px; }
  }

  @media (max-width: 700px) {
    #deck-wrap { top: 12%; }
    #battlefield { max-width: calc(100% - 120px); }
    .night-candle.left { left: 4px; }
    .night-candle.right { right: 4px; }
  }

:root {
  --card-w: 60px;
  --card-h: 88px;
  --card-r: 8px;
  --hand-overlap: -20px;
  --gold: #d7b078;
  --text: #f5e8d4;
  --card-shadow: 0 8px 22px rgba(0,0,0,.72);
  --sel-glow: 0 12px 30px rgba(255,205,120,.55);
}

html, body {
  background:
    radial-gradient(ellipse at 50% 55%, #190506 0%, #080203 48%, #010101 100%);
  color: var(--text);
}

body::before {
  content: '';
  position: fixed;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  background:
    radial-gradient(ellipse at 50% 50%, rgba(70,8,10,.20), transparent 62%),
    linear-gradient(180deg, rgba(0,0,0,.88) 0%, rgba(0,0,0,.12) 28%, rgba(0,0,0,.18) 72%, rgba(0,0,0,.92) 100%);
}

#scene {
  display: none !important;
}

#app {
  z-index: 2;
  padding: 0;
  background: transparent;
}

#topbar {
  display: none !important;
}

#opp-area {
  position: absolute;
  left: 0;
  right: 0;
  top: 18px;
  height: 92px;
  min-height: 92px;
  padding: 0;
  z-index: 12;
  background: transparent;
  color: #ead7bc;
}

#opp-hand {
  position: absolute;
  left: 50%;
  top: 8px;
  transform: translateX(-50%);
  height: 58px;
  align-items: flex-start;
  filter: drop-shadow(0 8px 12px rgba(0,0,0,.7));
}

#opp-hand .card-back {
  background:
    radial-gradient(circle at 50% 50%, rgba(120,15,18,.4), transparent 54%),
    repeating-linear-gradient(45deg, #4e0b0e 0 3px, #7d151a 3px 6px),
    #4b0a0d;
  border: 1px solid #9d6a43;
  box-shadow:
    0 3px 8px rgba(0,0,0,.7),
    inset 0 0 0 1px rgba(245,190,120,.16);
}

#opp-name {
  left: 4%;
  top: 28px;
  transform: none;
  padding: 10px 18px 10px 17px;
  border: 1px solid rgba(170,126,76,.48);
  border-radius: 999px;
  background: rgba(4,3,3,.72);
  box-shadow:
    0 5px 18px rgba(0,0,0,.55),
    inset 0 1px 0 rgba(255,220,170,.06);
  font-size: clamp(12px, 1.8vw, 18px);
  font-weight: 600;
  letter-spacing: .2px;
  text-shadow: 0 2px 5px #000;
}

#opp-name::before {
  content: '♟';
  display: inline-block;
  margin-right: 9px;
  color: #ead2ae;
  font-size: 1.05em;
}

#opp-count {
  right: 4%;
  top: 28px;
  transform: none;

.night-candle {

.night-candle.right { right: clamp(18px, 4.2vw, 72px); }

.night-candle .glow {
  position: absolute;
  left: 50%;
  top: 5%;
  width: 430%;
  height: 430%;
  transform: translate(-50%, -42%);
  border-radius: 50%;
  background: radial-gradient(circle,
    rgba(255,180,74,.30) 0%,
    rgba(255,101,25,.15) 20%,
    rgba(255,45,18,.055) 43%,
    transparent 70%);
  filter: blur(5px);
  animation: candleGlow 2.15s ease-in-out infinite alternate;
}

.night-candle .holder {
  position: absolute;
  left: 50%;
  bottom: 0;
  width: 105%;
  height: 24%;
  transform: translateX(-50%);
  border-radius: 50% 50% 35% 35%;
  background:
    radial-gradient(ellipse at 50% 22%, #d7a84d 0 12%, #7e4b16 31%, #2b1608 72%);
  border: 1px solid rgba(224,177,93,.7);
  box-shadow:
    0 8px 12px rgba(0,0,0,.65),
    inset 0 2px 3px rgba(255,220,130,.35);
}

.night-candle .wax {
  position: absolute;
  left: 50%;
  bottom: 12%;
  width: 62%;
  height: 57%;
  transform: translateX(-50%);
  border-radius: 46% 46% 24% 24%;
  background:
    linear-gradient(90deg, #a9692d 0%, #f4dca8 12%, #fff0c2 50%, #e4bd78 86%, #8c5123 100%);
  box-shadow:
    0 7px 13px rgba(0,0,0,.42),
    inset -4px 0 8px rgba(92,35,10,.28),
    inset 4px 0 7px rgba(255,255,220,.36);
}

.night-candle .wax::before,
.night-candle .wax::after {
  content: '';
  position: absolute;
  background: #e2bd7b;
  border-radius: 0 0 55% 55%;
  opacity: .8;
}

.night-candle .wax::before {
  left: 10%;
  top: 12%;
  width: 16%;
  height: 45%;
}

.night-candle .wax::after {
  right: 12%;
  top: 29%;
  width: 13%;
  height: 34%;
}

.night-candle .wick {
  position: absolute;
  left: 50%;
  bottom: 67%;
  width: 4%;
  height: 11%;
  transform: translateX(-50%);
  border-radius: 50%;
  background: #2b160d;
  z-index: 2;
}

.night-candle .flame {
  position: absolute;
  left: 50%;
  bottom: 71%;
  width: 30%;
  height: 43%;
  transform: translateX(-50%) rotate(1deg);
  transform-origin: 50% 90%;
  border-radius: 55% 45% 58% 42% / 65% 62% 38% 35%;
  background:
    radial-gradient(ellipse at 50% 76%, #fffbe2 0 19%, #ffd25b 32%, #ff7b18 59%, #e62b0d 79%, transparent 80%);
  filter: blur(.25px);
  box-shadow:
    0 0 12px rgba(255,181,65,.95),
    0 0 28px rgba(255,94,21,.70),
    0 0 54px rgba(255,49,14,.36);
  animation: flameDance .105s ease-in-out infinite alternate;
  z-index: 3;
}

.night-candle .flame::after {
  content: '';
  position: absolute;
  left: 50%;
  top: 32%;
  width: 35%;
  height: 43%;
  transform: translateX(-50%);
  border-radius: 50%;
  background: #fffbe8;
  filter: blur(.4px);
}

@keyframes flameDance {
  0%   { transform: translateX(-50%) rotate(-3deg) scale(.96,1.00); }
  18%  { transform: translateX(-49%) rotate(1deg) scale(1.01,.98); }
  36%  { transform: translateX(-52%) rotate(-1.5deg) scale(.98,1.03); }
  54%  { transform: translateX(-48%) rotate(2deg) scale(1.03,.97); }
  72%  { transform: translateX(-51%) rotate(-1deg) scale(.97,1.04); }
  100% { transform: translateX(-49%) rotate(3deg) scale(1.02,.98); }
}

@keyframes candleGlow {
  0%   { opacity: .62; transform: translate(-50%, -42%) scale(.96); }
  50%  { opacity: .82; transform: translate(-50%, -42%) scale(1.02); }
  100% { opacity: .68; transform: translate(-50%, -42%) scale(.98); }
}

.night-candle {

.night-candle .holder {
  transform: translateX(-50%) perspective(180px) rotateX(10deg);

    inset 0 -5px 8px rgba(0,0,0,.55);

.night-candle .wax {
  transform: translateX(-50%) perspective(160px) rotateX(2deg);
  box-shadow:
    0 10px 17px rgba(0,0,0,.5),
    inset -7px 0 11px rgba(84,31,8,.28),
    inset 6px 0 10px rgba(255,255,230,.48),
    inset 0 -7px 10px rgba(120,60,15,.16);

  box-shadow: 4px 5px 7px rgba(93,42,9,.22);
}

  animation: flameDance 1.65s ease-in-out infinite;
}

  animation: candleGlow 3.2s ease-in-out infinite;

<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
(() => {
'use strict';

const Sound = (() => {
  let ctx = null, master = null, enabled = true;

  function ensure() {
    if (ctx) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) { enabled = false; return; }
    ctx = new AC();
    master = ctx.createGain();
    master.gain.value = 0.22;
    master.connect(ctx.destination);
  }
  function resume() {
    if (!ctx) ensure();
    if (ctx && ctx.state === 'suspended') ctx.resume();
  }
  ['pointerdown','touchstart','keydown'].forEach(ev =>
    document.addEventListener(ev, resume, { passive: true }));

  function bell(freq, dur, vol = 0.22) {
    if (!enabled) return;
    ensure();
    if (!ctx) return;
    const t = ctx.currentTime;
    const o1 = ctx.createOscillator();
    const o2 = ctx.createOscillator();
    const g = ctx.createGain();
    o1.type = 'sine';
    o1.frequency.value = freq;
    o2.type = 'sine';
    o2.frequency.value = freq * 2.01;
    const g2 = ctx.createGain();
    g2.gain.value = 0.35;
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(vol, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o1.connect(g);
    o2.connect(g2).connect(g);
    g.connect(master);
    o1.start(t); o2.start(t);
    o1.stop(t + dur + 0.05);
    o2.stop(t + dur + 0.05);
  }

  function softNoise(dur, cutoff = 1800, vol = 0.15) {
    if (!enabled) return;
    ensure();
    if (!ctx) return;
    const t = ctx.currentTime;
    const len = Math.ceil(ctx.sampleRate * dur);
    const buf = ctx.createBuffer(1, len, ctx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) {
      const env = Math.sin(Math.PI * i / len);
      d[i] = (Math.random() * 2 - 1) * env;
    }
    const src = ctx.createBufferSource();
    src.buffer = buf;
    const f = ctx.createBiquadFilter();
    f.type = 'lowpass';
    f.frequency.value = cutoff;
    const g = ctx.createGain();
    g.gain.value = vol;
    src.connect(f).connect(g).connect(master);
    src.start(t);
  }

  function woodenTap() {
    if (!enabled) return;
    ensure();
    if (!ctx) return;
    const t = ctx.currentTime;
    softNoise(0.06, 900, 0.2);
    const o = ctx.createOscillator();
    const g = ctx.createGain();
    o.type = 'triangle';
    o.frequency.setValueAtTime(280, t);
    o.frequency.exponentialRampToValueAtTime(160, t + 0.08);
    g.gain.setValueAtTime(0.18, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.1);
    o.connect(g).connect(master);
    o.start(t);
    o.stop(t + 0.12);
  }

  let windNode = null;
  function startWind() {
    if (!enabled || windNode) return;
    ensure();
    if (!ctx) return;
    const len = ctx.sampleRate * 4;
    const buf = ctx.createBuffer(1, len, ctx.sampleRate);
    const d = buf.getChannelData(0);
    let last = 0;
    for (let i = 0; i < len; i++) {
      const w = Math.random() * 2 - 1;
      last = (last + 0.02 * w) / 1.02;
      d[i] = last * 3.2;
    }
    const src = ctx.createBufferSource();
    src.buffer = buf;
    src.loop = true;
    const f = ctx.createBiquadFilter();
    f.type = 'lowpass';
    f.frequency.value = 600;
    const g = ctx.createGain();
    g.gain.value = 0.05;
    src.connect(f).connect(g).connect(master);
    src.start();
    windNode = { src, g };
  }

  return {
    deal()    { bell(880, 0.35, 0.18); softNoise(0.08, 2200, 0.1); },
    play()    { softNoise(0.09, 1800, 0.14); bell(660, 0.28, 0.14); },
    beat()    { woodenTap(); bell(720, 0.3, 0.13); },
    take()    { softNoise(0.18, 1200, 0.18); bell(420, 0.35, 0.15); },
    shuffle() { for (let i = 0; i < 6; i++) setTimeout(() => softNoise(0.06, 2600, 0.11), i * 45); },
    click()   { bell(1240, 0.12, 0.12); },
    win()     { [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => bell(f, 0.5, 0.22), i * 130)); },
    lose()    { [440, 392, 330, 262].forEach((f, i) => setTimeout(() => bell(f, 0.55, 0.18), i * 150)); },
    startWind,
    toggle()  { enabled = !enabled; if (master) master.gain.value = enabled ? 0.22 : 0; return enabled; },
    isEnabled() { return enabled; },
  };
})();

const SUITS = ['♠', '♥', '♦', '♣'];
const RANKS = ['6', '7', '8', '9', '10', 'В', 'Д', 'К', 'А'];
const RED = new Set(['♥', '♦']);
const isRed = s => RED.has(s);

function shuffle(arr) {
  const a = arr.slice();
  const c = window.crypto || window.msCrypto;
  for (let i = a.length - 1; i > 0; i--) {
    let j;
    if (c && c.getRandomValues) {
      const b = new Uint32Array(1);
      c.getRandomValues(b);
      j = b[0] % (i + 1);
    } else {
      j = Math.floor(Math.random() * (i + 1));
    }
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function buildDeck() {
  const d = [];
  for (const s of SUITS) for (const r of RANKS) d.push({ s, r, v: RANKS.indexOf(r) });
  let out = d;
  for (let i = 0; i < 5; i++) out = shuffle(out);
  return out;
}

const cardId = c => c.s + c.r;
const sameCard = (a, b) => a && b && a.s === b.s && a.r === b.r;

function beats(def, atk, trump) {
  if (def.s === atk.s) return def.v > atk.v;
  if (def.s === trump) return true;
  return false;
}

function cardEl(card, { small = false, clickable = false } = {}) {
  const el = document.createElement('div');
  el.className = 'card ' + (isRed(card.s) ? 'red' : 'black') + (small ? ' small' : '');
  if (clickable) el.classList.add('clickable');

  const faceRank = card.r === 'В' || card.r === 'Д' || card.r === 'К';

  el.innerHTML =
    `<div class="corner tl"><div class="r">${card.r}</div><div class="s">${card.s}</div></div>` +
    `<div class="corner br"><div class="r">${card.r}</div><div class="s">${card.s}</div></div>`;

  if (faceRank) {
    el.classList.add('face');
    const glyph = card.r === 'В' ? '♞' : card.r === 'Д' ? '♛' : '♚';
    const crown = card.r === 'К' ? '👑' : '';
    const art = document.createElement('div');
    art.className = 'face-art';
    art.innerHTML =
      `<div class="frame"></div>` +
      (crown ? `<div class="crown">${crown}</div>` : '') +
      `<div class="glyph">${glyph}${card.s}</div>`;
    el.appendChild(art);
  } else if (card.r === 'А') {
    const pips = document.createElement('div');
    pips.className = 'pips';
    pips.innerHTML = `<div class="big-suit">${card.s}</div>`;
    el.appendChild(pips);
  } else {
    const big = document.createElement('div');
    big.className = 'pip-big';
    big.textContent = card.s;
    el.appendChild(big);

    const n = parseInt(card.r, 10);
    const layout = pipLayout(n);
    const pips = document.createElement('div');
    pips.className = 'pips';
    pips.style.display = 'grid';
    pips.style.gridTemplateColumns = '1fr 1fr';
    pips.style.gridTemplateRows = `repeat(${layout.rows}, 1fr)`;
    pips.style.padding = '0 6%';
    for (const c of layout.cells) {
      const cell = document.createElement('div');
      cell.style.display = 'flex';
      cell.style.alignItems = 'center';
      cell.style.justifyContent = 'center';
      cell.style.fontSize = '18cqw';
      cell.style.lineHeight = '1';
      cell.style.opacity = '.85';
      if (c) {
        const flip = (c === 'b') ? 'transform: rotate(180deg);' : '';
        cell.innerHTML = `<span style="${flip}">${card.s}</span>`;
      }
      pips.appendChild(cell);
    }
    el.appendChild(pips);
  }

  el.dataset.id = cardId(card);
  return el;
}

function pipLayout(n) {
  const layouts = {
    6:  { rows: 4, cells: ['t','t','t','t','b','b'] },
    7:  { rows: 4, cells: ['t','t','t','t','t','b','b',null] },
    8:  { rows: 4, cells: ['t','t','t','t','t','t','b','b'] },
    9:  { rows: 5, cells: ['t','t','t','t','t','t','t','b','b',null] },
    10: { rows: 5, cells: ['t','t','t','t','t','t','t','t','b','b'] },
  };
  return layouts[n] || { rows: 4, cells: ['t','t','t','t','t','t','b','b'] };
}

function cardBackEl(w = 28, h = 42) {
  const el = document.createElement('div');
  el.className = 'card-back';
  el.style.width = w + 'px';
  el.style.height = h + 'px';
  return el;
}

const G = {
  mode: 'solo',
  mySide: 'player',
  deck: [],
  trump: '',
  trumpCard: null,
  hands: { player: [], ai: [] },
  table: [],
  attacker: 'player',
  phase: 'idle',
  busy: false,
  over: false,
  winner: null,
  roomCode: null,
  peer: null,
  conn: null,
  isHost: false,
};

const myHand = () => G.hands[G.mySide];
const oppHand = () => G.hands[G.mySide === 'player' ? 'ai' : 'player'];
const defenderSide = () => (G.attacker === 'player' ? 'ai' : 'player');
const iAmAttacker = () => G.attacker === G.mySide;
const iAmDefender = () => G.attacker !== G.mySide;

const $ = s => document.querySelector(s);
const oppHandEl    = $('#opp-hand');
const oppCountEl   = $('#opp-count');
const oppNameEl    = $('#opp-name');
const battlefield  = $('#battlefield');
const deckCountEl  = $('#deck-count');
const trumpSlot    = $('#trump-slot');
const playerHandEl = $('#player-hand');
const statusEl     = $('#status');
const turnHintEl   = $('#turn-hint');
const btnAction    = $('#btn-action');
const btnSecondary = $('#btn-secondary');
const roleLabel    = $('#role-label');
const toastEl      = $('#toast');
const menuOverlay  = $('#menu-overlay');
const hostOverlay  = $('#host-overlay');
const joinOverlay  = $('#join-overlay');
const resultOverlay= $('#result-overlay');
const soundToggle  = $('#sound-toggle');

function toast(msg, ms = 1800) {
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => toastEl.classList.remove('show'), ms);
}

function recalcHandOverlap(count) {
  const MIN_VISIBLE = 18;
  const MAX_OVERLAP_RATIO = 0.78;

  if (count <= 0) return;

  const cardW = parseFloat(
    getComputedStyle(document.documentElement).getPropertyValue('--card-w')
  ) || 60;

  const availW = playerHandEl.clientWidth - 16;
  if (availW <= 0) return;

  if (count === 1) {
    document.documentElement.style.setProperty('--hand-overlap', '0px');
    return;
  }

  if (cardW * count <= availW) {
    document.documentElement.style.setProperty('--hand-overlap', '0px');
    return;
  }

  let visW = (availW - cardW) / (count - 1);

  const minW = MIN_VISIBLE;
  const maxW = cardW * MAX_OVERLAP_RATIO;
  visW = Math.max(minW, Math.min(maxW, visW));

  const overlapPx = visW - cardW;
  document.documentElement.style.setProperty('--hand-overlap', overlapPx + 'px');
}

let resizeTimer = null;
function onResize() {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => {
    if (G.phase === 'playing') recalcHandOverlap(myHand().length);
  }, 100);
}
window.addEventListener('resize', onResize);
window.addEventListener('orientationchange', onResize);

function render() {
  renderOpponent();
  renderTable();
  renderPlayerHand();
  renderDeckAndTrump();
  renderControls();
  renderStatus();
}

function renderOpponent() {
  oppHandEl.innerHTML = '';
  const n = oppHand().length;
  oppNameEl.textContent = G.mode === 'solo'
    ? 'Компьютер'
    : (G.mySide === 'player' ? 'Соперник' : 'Вы');
  oppCountEl.textContent = n + ' карт';
  for (let i = 0; i < n; i++) oppHandEl.appendChild(cardBackEl());
}

function renderTable() {
  battlefield.innerHTML = '';
  for (const pair of G.table) {
    const wrap = document.createElement('div');
    wrap.className = 'pair';
    if (pair.defend) wrap.classList.add('beaten');

    const atkSlot = document.createElement('div');
    atkSlot.className = 'slot-atk';
    if (pair.attack) atkSlot.appendChild(cardEl(pair.attack, { small: true }));

    const defSlot = document.createElement('div');
    defSlot.className = 'slot-def';
    if (pair.defend) defSlot.appendChild(cardEl(pair.defend, { small: true }));

    wrap.appendChild(atkSlot);
    wrap.appendChild(defSlot);
    battlefield.appendChild(wrap);
  }
}

function renderPlayerHand() {
  playerHandEl.innerHTML = '';
  const hand = myHand().slice().sort((a, b) => {
    const ta = a.s === G.trump ? 1 : 0;
    const tb = b.s === G.trump ? 1 : 0;
    if (ta !== tb) return ta - tb;
    if (a.s !== b.s) return SUITS.indexOf(a.s) - SUITS.indexOf(b.s);
    return a.v - b.v;
  });

  for (const card of hand) {
    const el = cardEl(card, { clickable: true });
    el.addEventListener('click', () => onMyCardClick(card));
    playerHandEl.appendChild(el);
  }

  requestAnimationFrame(() => recalcHandOverlap(hand.length));
}

function renderDeckAndTrump() {
  deckCountEl.textContent = G.deck.length;
  trumpSlot.innerHTML = '';
  if (G.trumpCard) {
    const c = G.trumpCard;
    const el = document.createElement('div');
    el.className = 'trump-card-big ' + (isRed(c.s) ? 'red' : 'black');
    el.innerHTML = `<div class="r">${c.r}</div><div class="s">${c.s}</div>`;
    trumpSlot.appendChild(el);
  }
}

function renderControls() {
  btnAction.disabled = true;
  btnSecondary.disabled = true;
  if (G.over || G.phase !== 'playing') return;
  if (G.busy) return;

  if (iAmAttacker()) {
    const tableNotEmpty = G.table.length > 0;
    const allBeaten = tableNotEmpty && G.table.every(p => p.defend);
    btnAction.textContent = tableNotEmpty ? 'Подкинуть' : 'Ходить';
    btnAction.disabled = false;
    btnSecondary.textContent = 'Бито';
    btnSecondary.disabled = !allBeaten;
  } else {
    const hasUndefended = G.table.some(p => !p.defend);
    btnAction.textContent = 'Бить';
    btnAction.disabled = !hasUndefended;
    btnSecondary.textContent = 'Взять';
    btnSecondary.disabled = !hasUndefended;
  }
}

function renderStatus() {
  if (G.over) {
    statusEl.textContent = G.winner === G.mySide ? '🎉 Победа!' : '😔 Поражение';
    turnHintEl.textContent = '';
    return;
  }
  if (G.phase !== 'playing') {
    statusEl.textContent = 'Ожидание…';
    turnHintEl.textContent = '';
    return;
  }
  if (G.busy) {
    turnHintEl.textContent = 'Соперник думает…';
    statusEl.textContent = '';
    return;
  }

  if (iAmAttacker()) {
    turnHintEl.textContent = '⚔ Ваш ход — вы атакуете';
    if (G.table.length === 0) statusEl.textContent = 'Выберите карту, чтобы начать ход.';
    else if (G.table.every(p => p.defend)) statusEl.textContent = 'Соперник отбился. Подкиньте ещё или нажмите «Бито».';
    else statusEl.textContent = 'Ждём соперника…';
  } else {
    turnHintEl.textContent = '🛡 Соперник атакует';
    const undef = G.table.find(p => !p.defend);
    if (undef) statusEl.textContent = 'Выберите карту, чтобы побить, или «Взять».';
    else statusEl.textContent = 'Ждём соперника…';
  }
}

function newGame(firstAttacker = 'player') {
  G.deck = buildDeck();
  G.trumpCard = G.deck[G.deck.length - 1];
  G.trump = G.trumpCard.s;
  G.hands = { player: [], ai: [] };
  for (let i = 0; i < 6; i++) {
    G.hands.player.push(G.deck.pop());
    G.hands.ai.push(G.deck.pop());
  }
  G.table = [];
  G.attacker = firstAttacker;
  G.phase = 'playing';
  G.busy = false;
  G.over = false;
  G.winner = null;
  Sound.shuffle();
  render();
  if (G.mode === 'solo' && G.attacker === 'ai') scheduleAIAttack();
}

function removeFromHand(side, card) {
  const h = G.hands[side];
  const i = h.findIndex(c => sameCard(c, card));
  if (i >= 0) h.splice(i, 1);
}

function addToHand(side, cards) {
  for (const c of cards) G.hands[side].push(c);
}

function onMyCardClick(card) {
  if (G.over || G.phase !== 'playing' || G.busy) return;

  if (iAmAttacker()) {
    if (G.table.length === 0) {
      playerAttack(card);
    } else {
      if (!canAddToTable(card)) {
        toast('Подкидывать можно только карты того же достоинства');
        return;
      }
      playerAttack(card);
    }
  } else {
    const undef = G.table.find(p => !p.defend);
    if (!undef) { toast('Нечего бить'); return; }
    if (!beats(card, undef.attack, G.trump)) { toast('Эта карта не бьёт!'); return; }
    playerDefend(card, undef);
  }
}

function canAddToTable(card) {
  if (G.table.length === 0) return true;
  const ranks = new Set();
  for (const p of G.table) {
    ranks.add(p.attack.r);
    if (p.defend) ranks.add(p.defend.r);
  }
  return ranks.has(card.r);
}

function playerAttack(card) {
  removeFromHand(G.mySide, card);
  G.table.push({ attack: card, defend: null });
  Sound.play();
  render();
  netSend({ type: 'attack', card, side: G.mySide });

  if (G.mode === 'solo') {
    G.busy = true;
    render();
    setTimeout(() => {
      G.busy = false;
      aiDefendOrTake();
    }, 600);
  } else {
    G.busy = true;
    render();
  }
}

function playerDefend(card, pair) {
  removeFromHand(G.mySide, card);
  pair.defend = card;
  Sound.beat();
  render();
  netSend({ type: 'defend', card, attack: pair.attack });

  if (G.mode === 'solo') {
    G.busy = true;
    render();
    setTimeout(() => {
      G.busy = false;
      aiAttackerDecision();
    }, 600);
  } else {
    G.busy = true;
    render();
  }
}

function playerPass() {
  if (!(G.table.length > 0 && G.table.every(p => p.defend))) return;
  Sound.play();
  netSend({ type: 'pass', side: G.mySide });
  const prevAttacker = G.attacker;
  G.table = [];
  refillHands();
  if (checkEnd()) return;
  G.attacker = prevAttacker === 'player' ? 'ai' : 'player';
  render();
  if (G.mode === 'solo' && G.attacker === 'ai') scheduleAIAttack();
}

function playerTake() {
  if (!iAmDefender()) return;
  const all = [];
  for (const p of G.table) {
    all.push(p.attack);
    if (p.defend) all.push(p.defend);
  }
  addToHand(G.mySide, all);
  G.table = [];
  Sound.take();
  render();
  netSend({ type: 'take', side: G.mySide });

  const nextAttacker = G.attacker;
  G.busy = true;
  setTimeout(() => {
    G.busy = false;
    refillHands();
    if (checkEnd()) return;
    G.attacker = nextAttacker;
    render();
    if (G.mode === 'solo' && G.attacker === 'ai') scheduleAIAttack();
  }, 600);
}

function refillHands() {
  const order = [defenderSide(), G.attacker];
  for (const side of order) {
    const need = 6 - G.hands[side].length;
    for (let i = 0; i < need && G.deck.length > 0; i++) {
      G.hands[side].push(G.deck.pop());
    }
  }
  Sound.deal();
}

function checkEnd() {
  if (G.deck.length > 0) return false;
  const pEmpty = G.hands.player.length === 0;
  const aEmpty = G.hands.ai.length === 0;
  if (pEmpty || aEmpty) {
    G.over = true;
    G.phase = 'over';
    G.winner = pEmpty ? 'player' : 'ai';
    render();
    const win = G.winner === G.mySide;
    win ? Sound.win() : Sound.lose();
    setTimeout(() => showResult(G.winner === G.mySide), 500);
    netSend({ type: 'over', winner: G.winner });
    return true;
  }
  return false;
}

function aiDefendOrTake() {
  if (G.over || G.mode !== 'solo') return;
  if (G.attacker === 'ai') return;
  const undef = G.table.find(p => !p.defend);
  if (!undef) { aiAttackerDecision(); return; }

  const candidates = G.hands.ai.filter(c => beats(c, undef.attack, G.trump));
  if (candidates.length === 0) {
    const all = [];
    for (const p of G.table) {
      all.push(p.attack);
      if (p.defend) all.push(p.defend);
    }
    addToHand('ai', all);
    G.table = [];
    Sound.take();
    render();
    netSend({ type: 'take', side: 'ai' });

    const nextAttacker = G.attacker;
    G.busy = true;
    setTimeout(() => {
      G.busy = false;
      refillHands();
      if (checkEnd()) return;
      G.attacker = nextAttacker;
      render();
      if (G.mode === 'solo' && G.attacker === 'ai') scheduleAIAttack();
    }, 700);
    return;
  }

  candidates.sort((a, b) => {
    const ta = a.s === G.trump ? 1 : 0;
    const tb = b.s === G.trump ? 1 : 0;
    if (ta !== tb) return ta - tb;
    return a.v - b.v;
  });
  const card = candidates[0];
  undef.defend = card;
  removeFromHand('ai', card);
  Sound.beat();
  render();
}

function aiAttackerDecision() {
  if (G.over || G.mode !== 'solo') return;
  if (G.attacker !== 'ai') return;
  if (!G.table.every(p => p.defend)) return;

  const ranks = new Set();
  for (const p of G.table) {
    ranks.add(p.attack.r);
    if (p.defend) ranks.add(p.defend.r);
  }
  const addable = G.hands.ai.filter(c => ranks.has(c.r));

  const wantAdd = addable.length > 0 && Math.random() < 0.7;
  if (wantAdd) {
    addable.sort((a, b) => a.v - b.v);
    const card = addable[0];
    removeFromHand('ai', card);
    G.table.push({ attack: card, defend: null });
    Sound.play();
    render();
    netSend({ type: 'attack', card, side: 'ai' });
  } else {
    Sound.play();
    G.table = [];
    refillHands();
    if (checkEnd()) return;
    G.attacker = 'player';
    render();
  }
}

function scheduleAIAttack() {
  if (G.over || G.mode !== 'solo') return;
  if (G.attacker !== 'ai') return;
  G.busy = true;
  render();
  setTimeout(() => {
    if (G.over || G.attacker !== 'ai') return;
    G.busy = false;
    if (G.hands.ai.length === 0) {
      G.attacker = 'player';
      render();
      return;
    }
    const nonTrump = G.hands.ai.filter(c => c.s !== G.trump);
    let card;
    if (nonTrump.length) {
      nonTrump.sort((a, b) => a.v - b.v);
      card = nonTrump[0];
    } else {
      G.hands.ai.sort((a, b) => a.v - b.v);
      card = G.hands.ai[0];
    }
    removeFromHand('ai', card);
    G.table.push({ attack: card, defend: null });
    Sound.play();
    render();
    netSend({ type: 'attack', card, side: 'ai' });
  }, 800);
}

btnAction.addEventListener('click', () => {
  Sound.click();
  if (G.over || G.phase !== 'playing' || G.busy) return;
  if (iAmAttacker()) {
    if (G.table.length === 0) toast('Выберите карту для атаки');
    else toast('Выберите карту того же достоинства для подкидывания');
  } else {
    toast('Выберите карту для защиты');
  }
});

btnSecondary.addEventListener('click', () => {
  Sound.click();
  if (G.over || G.phase !== 'playing' || G.busy) return;
  if (iAmAttacker()) {
    if (G.table.length > 0 && G.table.every(p => p.defend)) playerPass();
    else toast('Не все карты отбиты');
  } else {
    if (G.table.some(p => !p.defend)) playerTake();
  }
});

const NET_PREFIX = 'durak-v3-';

function netSend(msg) {
  if (G.mode === 'solo') return;
  if (!G.conn || !G.conn.open) return;
  try { G.conn.send(msg); } catch (e) { console.warn(e); }
}

function netApplyRemote(msg) {
  if (!msg || !msg.type) return;
  const other = G.mySide === 'player' ? 'ai' : 'player';

  switch (msg.type) {
    case 'state': {
      // На случай, если open уже прошёл, но окна остались — прячем принудительно
      menuOverlay.classList.add('hidden');
      hostOverlay.classList.add('hidden');
      joinOverlay.classList.add('hidden');

      G.deck = msg.state.deck;
      G.trump = msg.state.trump;
      G.trumpCard = msg.state.trumpCard;
      G.hands = msg.state.hands;
      G.table = msg.state.table;
      G.attacker = msg.state.attacker;
      G.phase = 'playing';
      G.over = false;
      G.busy = false;
      render();
      break;
    }
    case 'attack': {
      removeFromHand(other, msg.card);
      G.table.push({ attack: msg.card, defend: null });
      Sound.play();
      G.busy = false;
      render();
      break;
    }
    case 'defend': {
      const pair = G.table.find(p => sameCard(p.attack, msg.attack));
      if (pair) {
        removeFromHand(other, msg.card);
        pair.defend = msg.card;
        Sound.beat();
      }
      G.busy = false;
      render();
      break;
    }
    case 'take': {
      const all = [];
      for (const p of G.table) {
        all.push(p.attack);
        if (p.defend) all.push(p.defend);
      }
      addToHand(msg.side, all);
      G.table = [];
      Sound.take();
      const nextAttacker = G.attacker;
      G.busy = true;
      setTimeout(() => {
        G.busy = false;
        refillHands();
        if (checkEnd()) return;
        G.attacker = nextAttacker;
        render();
      }, 400);
      break;
    }
    case 'pass': {
      G.table = [];
      refillHands();
      if (checkEnd()) return;
      G.attacker = msg.side === 'player' ? 'ai' : 'player';
      G.busy = false;
      render();
      break;
    }
    case 'over': {
      G.over = true;
      G.phase = 'over';
      G.winner = msg.winner;
      render();
      setTimeout(() => showResult(msg.winner === G.mySide), 400);
      break;
    }
    case 'hello': break;
  }
}

function setupConn(conn) {
  G.conn = conn;
  conn.on('open', () => {
    // ★ ГЛАВНОЕ ИСПРАВЛЕНИЕ: при успешном открытии соединения
    // прячем ВСЕ стартовые окна — и у хоста, и у гостя.
    menuOverlay.classList.add('hidden');
    hostOverlay.classList.add('hidden');
    joinOverlay.classList.add('hidden');

    netSend({ type: 'hello' });
    if (G.isHost) {
      newGame('player');
      setTimeout(() => {
        netSend({
          type: 'state',
          state: {
            deck: G.deck,
            trump: G.trump,
            trumpCard: G.trumpCard,
            hands: G.hands,
            table: G.table,
            attacker: G.attacker,
          },
        });
      }, 300);
    }
  });
  conn.on('data', data => netApplyRemote(data));
  conn.on('close', () => toast('Соединение потеряно'));
  conn.on('error', e => console.warn(e));
}

function startHost() {
  G.mode = 'host';
  G.isHost = true;
  G.mySide = 'player';
  menuOverlay.classList.add('hidden');
  roleLabel.textContent = 'Хост · вы — игрок 1';

  const code = String(Math.floor(1000 + Math.random() * 9000));
  G.roomCode = code;
  const peerId = NET_PREFIX + code;

  $('#host-code').textContent = code.split('').join(' ');
  const link = location.origin + location.pathname + '#' + code;
  $('#host-link').textContent = link;
  hostOverlay.classList.remove('hidden');

  try { G.peer = new Peer(peerId, { debug: 0 }); }
  catch (e) { toast('Ошибка PeerJS'); return; }

  G.peer.on('error', err => {
    console.warn(err);
    if (err.type === 'unavailable-id') {
      toast('Код занят, пробуем снова…');
      G.peer.destroy();
      setTimeout(startHost, 300);
    } else {
      toast('Ошибка сети: ' + err.type);
    }
  });
  G.peer.on('connection', conn => {
    hostOverlay.classList.add('hidden');
    setupConn(conn);
  });
}

function startJoin(code) {
  code = String(code).trim();
  if (!/^\d{4}$/.test(code)) {
    $('#join-error').textContent = 'Введите 4 цифры';
    return;
  }
  G.mode = 'guest';
  G.isHost = false;
  G.mySide = 'ai';
  roleLabel.textContent = 'Гость · вы — игрок 2';

  const peerId = NET_PREFIX + code;
  try { G.peer = new Peer({ debug: 0 }); }
  catch (e) { $('#join-error').textContent = 'Ошибка PeerJS'; return; }

  G.peer.on('open', () => {
    const conn = G.peer.connect(peerId, { reliable: true });
    setupConn(conn);
  });
  G.peer.on('error', err => {
    console.warn(err);
    if (err.type === 'peer-unavailable') {
      $('#join-error').textContent = 'Комната не найдена';
    } else {
      $('#join-error').textContent = 'Ошибка: ' + err.type;
    }
  });
}

$('#m-solo').addEventListener('click', () => {
  Sound.click();
  menuOverlay.classList.add('hidden');
  G.mode = 'solo';
  G.mySide = 'player';
  roleLabel.textContent = 'Игра против компьютера';
  const first = Math.random() < 0.5 ? 'player' : 'ai';
  newGame(first);
});

$('#m-host').addEventListener('click', () => { Sound.click(); startHost(); });
$('#m-join').addEventListener('click', () => {
  Sound.click();
  menuOverlay.classList.add('hidden');
  joinOverlay.classList.remove('hidden');
  $('#join-code').value = '';
  $('#join-error').textContent = '';
  setTimeout(() => $('#join-code').focus(), 100);
});

$('#join-cancel').addEventListener('click', () => {
  Sound.click();
  joinOverlay.classList.add('hidden');
  menuOverlay.classList.remove('hidden');
  if (G.peer) { try { G.peer.destroy(); } catch (e) {} G.peer = null; }
});

$('#join-go').addEventListener('click', () => {
  Sound.click();
  $('#join-error').textContent = '';
  startJoin($('#join-code').value);
});

$('#join-code').addEventListener('keydown', e => {
  if (e.key === 'Enter') $('#join-go').click();
});

$('#host-cancel').addEventListener('click', () => {
  Sound.click();
  hostOverlay.classList.add('hidden');
  menuOverlay.classList.remove('hidden');
  if (G.peer) { try { G.peer.destroy(); } catch (e) {} G.peer = null; }
});

$('#host-copy').addEventListener('click', () => {
  const link = location.origin + location.pathname + '#' + G.roomCode;
  navigator.clipboard.writeText(link).then(() => toast('Ссылка скопирована'));
});

$('#result-again').addEventListener('click', () => {
  Sound.click();
  resultOverlay.classList.add('hidden');
  if (G.mode === 'solo') {
    const first = Math.random() < 0.5 ? 'player' : 'ai';
    newGame(first);
  } else {
    location.reload();
  }
});

$('#result-menu').addEventListener('click', () => {
  Sound.click();
  location.hash = '';
  location.reload();
});

soundToggle.addEventListener('click', () => {
  const on = Sound.toggle();
  soundToggle.textContent = on ? '🔊 Звук вкл.' : '🔇 Звук выкл.';
});

function showResult(win) {
  $('#result-title').textContent = win ? '🎉 Победа!' : '😔 Поражение';
  $('#result-text').textContent = win
    ? 'Вы избавились от всех карт первым!'
    : 'Соперник избавился от карт первым.';
  resultOverlay.classList.remove('hidden');
}

let ambienceStarted = false;
function startAmbience() {
  if (ambienceStarted) return;
  ambienceStarted = true;
  Sound.startWind();
}
['pointerdown', 'keydown', 'touchstart'].forEach(ev =>
  document.addEventListener(ev, startAmbience, { once: true, passive: true }));

(function autoJoin() {
  const hash = location.hash.replace('#', '').trim();
  if (/^\d{4}$/.test(hash)) {
    menuOverlay.classList.add('hidden');
    joinOverlay.classList.remove('hidden');
    $('#join-code').value = hash;
    setTimeout(() => $('#join-go').click(), 400);
  }
})();

})();
</script>
